spring.application.name=rag



# Gemini chat
spring.ai.google.genai.api-key=${GCP_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Gemini embeddings
spring.ai.google.genai.embedding.api-key=${GCP_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# Qdrant
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=pdf_docs
spring.ai.vectorstore.qdrant.initialize-schema=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


